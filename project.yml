name: Storybook
options:
  bundleIdPrefix: com.brudibee
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  Storybook:
    type: application
    platform: iOS
    sources:
      - path: StorybookApp
      - path: Audio
        type: folder
        buildPhase: resources
    info:
      path: StorybookApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brudibee.storybook
        PRODUCT_NAME: Storybook
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    scheme:
      testTargets: []
